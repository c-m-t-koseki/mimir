<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mimir 設定</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<nav id="tabs" role="tablist">
  <button role="tab" data-tab="general">一般</button>
  <button role="tab" data-tab="keys">キー</button>
  <button role="tab" data-tab="models">モデル</button>
  <button role="tab" data-tab="dict">辞書</button>
  <button role="tab" data-tab="learning">学習</button>
  <button role="tab" data-tab="history">履歴</button>
</nav>
<main id="page" role="tabpanel"></main>
<footer>
  <p id="error" role="alert" hidden></p>
  <p class="muted">変えた設定は、それぞれのアプリに戻ったときに効きます。</p>
</footer>
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <menu>
      <button value="cancel">やめる</button>
      <button value="ok" class="danger">すべて消す</button>
    </menu>
  </form>
</dialog>
</body>
</html>
