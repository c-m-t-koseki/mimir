name: mimir-fcitx5 CI

on:
  push:
    branches: [main]
    paths:
      - 'mimir-im/fcitx5/**'
      - 'mimir-im/core/**'
      - 'mimir-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mimir-fcitx5-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mimir-im/fcitx5/**'
      - 'mimir-im/core/**'
      - 'mimir-engine/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mimir-fcitx5-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo check
        run: cargo check -p mimir-fcitx5 --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run cargo clippy
        run: cargo clippy -p mimir-fcitx5 --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt -p mimir-fcitx5 -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run tests
        run: cargo test -p mimir-fcitx5
